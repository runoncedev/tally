
[functions.gmail-watch]
enabled = true
verify_jwt = true
import_map = "./functions/gmail-watch/deno.json"
entrypoint = "./functions/gmail-watch/index.ts"

[functions.gmail-watch-cron]
enabled = true
verify_jwt = false
import_map = "./functions/gmail-watch-cron/deno.json"
entrypoint = "./functions/gmail-watch-cron/index.ts"

[functions.gmail-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/gmail-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/gmail-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/gmail-webhook/*.html" ]
